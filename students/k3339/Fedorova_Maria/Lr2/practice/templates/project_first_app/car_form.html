{% extends "base.html" %}

{% block title %}Car form{% endblock %}

{% block content %}
  <div class="modal-card">
    <h1>{% if object %}Редактировать автомобиль{% else %}Добавить автомобиль{% endif %}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Сохранить</button>
    </form>
    <p class="form-back"><a href="{% url 'car_list' %}">Назад</a></p>
  </div>
{% endblock %}
