{% extends "base.html" %}

{% block title %}Delete car{% endblock %}

{% block content %}
  <div class="modal-card">
    <h1>Удалить автомобиль?</h1>
    <p>{{ object }}</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit">Да, удалить</button>
    </form>
    <p class="form-back"><a href="{% url 'car_list' %}">Отмена</a></p>
  </div>
{% endblock %}
